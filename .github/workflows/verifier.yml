# .github/workflows/verifier.yml - le parcours de l'acheteur, joue par GitHub a chaque envoi.
#
# POURQUOI. La demo se construit chez Cloudflare depuis main, et seulement
# depuis main : une branche de travail n'a aucun build tant qu'elle n'est pas
# fusionnee. Ce flux rejoue la chaine exacte du depot (install verrouille,
# check, build, test, lint) sur chaque branche, AVANT la fusion. Les codes de
# sortie font foi, jamais la sortie texte. Un acheteur qui pousse ce theme sur
# GitHub obtient le meme garde-fou sans rien ecrire.
name: verifier

concurrency:
  group: verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Economie de minutes (13/10/2026) : la poussee ne rejoue le parcours que sur
# main ; une branche de travail est verifiee par sa demande de fusion, une
# seule fois. Un envoi qui ne touche que la documentation ne lance rien : les
# controles locaux (pnpm lint:house) la couvrent avant chaque envoi.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "wiki/**"
      - ".github/*.md"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "wiki/**"
      - ".github/*.md"
  workflow_dispatch:

jobs:
  parcours:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Les images optimisees par Astro sont gardees d'une execution a l'autre :
      # sans ce cache, chaque construction les recalcule toutes.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs') }}-
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint:house
