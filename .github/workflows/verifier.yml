# .github/workflows/verifier.yml - le parcours de l'acheteur, joue par GitHub a chaque envoi.
#
# POURQUOI. La demo se construit chez Cloudflare depuis main, et seulement
# depuis main : une branche de travail n'a aucun build tant qu'elle n'est pas
# fusionnee. Ce flux rejoue la chaine exacte du depot (install verrouille,
# check, build, test, lint) sur chaque branche, AVANT la fusion. Les codes de
# sortie font foi, jamais la sortie texte. Un acheteur qui pousse ce theme sur
# GitHub obtient le meme garde-fou sans rien ecrire.
name: verifier

concurrency:
  group: verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  parcours:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint:house
